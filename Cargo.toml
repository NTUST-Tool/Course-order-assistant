[package]
name = "Course-order-assistant"
description = "A course order assistant for NTUST"
version = "1.3.0"
edition = "2024"

[package.metadata.winresource]
OriginalFilename = "選課志願序小幫手.exe"
LegalCopyright = "Copyright © 2024 NTUST-Tool"


[build-dependencies]
winresource = "0.1"

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "native-tls-vendored", "query"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0"
tabled = "0.21.0"
regex = "1.12.3"
kdam = { version = "0.6.4", features = ["spinner", "template"] }
futures = "0.3.32"
scraper = "0.27.0"
anyhow = "1.0.102"
mailparse = "0.16.1"
encoding_rs = "0.8"
rand = "0.9.2"
chrono = "0.4"
sha2 = "0.10"
machineid-rs = "1.2.4"

[[bin]]
name = "Course-order-assistant"
path = "src/main.rs"
