[package]
name = "Course-order-assistant"
description = "A course order assistant for NTUST"
version = "1.3.0"
edition = "2024"

[package.metadata.winresource]
OriginalFilename = "選課志願序小幫手.exe"
LegalCopyright = "Copyright © 2024 NTUST-Tool"


[build-dependencies]
winresource = "0.1"

[dependencies]
reqwest = { version = "0.12.26", features = ["json", "native-tls-vendored"] }
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5.53", features = ["derive"] }
serde_json = "1.0"
tabled = "0.20.0"
regex = "1.12.2"
kdam = { version = "0.6.3", features = ["spinner", "template"] }
futures = "0.3.31"
scraper = "0.25.0"
anyhow = "1.0.100"
mailparse = "0.16.1"
encoding_rs = "0.8"
rand = "0.8"
chrono = "0.4"

[[bin]]
name = "Course-order-assistant"
path = "src/main.rs"
