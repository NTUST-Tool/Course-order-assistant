name: "CI"
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/**"
      - ".github/workflows/ci.yaml"
    branches:
      - "rust"
  pull_request:
    paths:
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/**"
      - ".github/workflows/ci.yaml"
    branches:
      - "rust"


permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }} app
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: setup on non-Linux
        uses: actions-rust-lang/setup-rust-toolchain@v1
        if: matrix.os != 'ubuntu-latest'

      - name: setup on Linux
        uses: actions-rust-lang/setup-rust-toolchain@v1
        if: matrix.os == 'ubuntu-latest'
        with:
          target: x86_64-unknown-linux-musl

      - name: test dependencies and course parsing
        run: cargo test --locked

      - name: build on non-Linux
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --locked

      - name: build on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Smoke test executable
        shell: bash
        timeout-minutes: 1
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            binary=target/x86_64-unknown-linux-musl/release/Course-order-assistant
          elif [ "$RUNNER_OS" = "Windows" ]; then
            binary=target/release/Course-order-assistant.exe
          else
            binary=target/release/Course-order-assistant
          fi
          "$binary" --help
          printf '%s\n' 0 | "$binary"
          "$binary" < /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-Build
          path: |
            target/x86_64-unknown-linux-musl/release/Course-order-assistant
            target/release/Course-order-assistant
            target/release/Course-order-assistant.exe
